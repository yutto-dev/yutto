[package]
name = "yutto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
description = "Rust download backend and Python bindings for yutto"
readme = "README.md"
keywords = ["async", "bilibili", "download", "video", "yutto"]
categories = ["asynchronous", "multimedia::video", "network-programming"]
publish = ["crates-io"]

[lib]
name = "yutto"
crate-type = ["cdylib", "rlib"]

[dependencies]
haya = { version = "0.0.1", path = "../haya" }
haya-http = { version = "0.0.1", path = "../haya-http" }
pyo3 = "0.29.0"
reqwest.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py311"]
abi3t = ["pyo3/abi3t-py315"]
