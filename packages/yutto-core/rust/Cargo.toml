[workspace]
members = ["crates/haya", "crates/haya-http", "crates/yutto"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/yutto-dev/yutto"
license = "GPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1.89"
bytes = "1.10.1"
flate2 = "1.1.9"
futures-util = "0.3.31"
reqwest = { version = "0.13.0", default-features = false, features = ["cookies", "http2", "rustls-tls", "socks", "stream"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
