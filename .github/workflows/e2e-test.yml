name: e2e Test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
        architecture: ["x64"]
    name: Python ${{ matrix.python-version }} on ${{ matrix.architecture }} e2e test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare wheel cache identity
        id: wheels
        run: python scripts/prepare-ci-cache.py

      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: ""
          cache-suffix: ci-wheels-${{ steps.wheels.outputs.cache-key }}
          prune-cache: true

      - name: Cache native build dependencies
        if: steps.uv.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            packages/biliass/rust
          shared-key: native-${{ matrix.python-version }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('**/pyproject.toml', 'uv.lock') }}
          env-vars: ImageOS PYO3 PYTHON MATURIN UV YUTTO_CI_BUILD_ENV_KEY
          cache-bin: false

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install ffmpeg

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          just ci-install ${{ matrix.python-version }}

      - name: e2e without subprocess
        run: |
          uv run yutto -v
          uv run yutto -h
          uv run yutto https://www.bilibili.com/video/BV1AZ4y147Yg -w -d __test_files__
          rm -rf __test_files__

      - name: e2e test
        run: |
          just ci-e2e-test ${{ matrix.python-version }}
