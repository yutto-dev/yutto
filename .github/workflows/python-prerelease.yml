name: Experimental Python prerelease

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-prerelease:
    name: Experimental Python ${{ matrix.python-version }} (Pydantic beta)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15", "3.15t"]
    env:
      # The test recipes must not silently restore the production dependency set.
      UV_NO_SYNC: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          allow-prereleases: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # Keep this pilot's dependency/build cache separate from stable CI.
          enable-cache: false

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install ffmpeg

      - name: Install isolated prerelease dependencies
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/yutto-python-prerelease
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$UV_PROJECT_ENVIRONMENT" >> "$GITHUB_ENV"
          uv venv --python "$PYTHON" "$UV_PROJECT_ENVIRONMENT"
          # Retain both workspace packages and every other production/dev pin.
          uv export --locked --all-extras --dev --no-editable --no-hashes \
            --no-emit-package pydantic --no-emit-package pydantic-core \
            --no-emit-package typing-inspection \
            --output-file "$RUNNER_TEMP/python-prerelease-requirements.txt"
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" \
            --no-sources --prerelease explicit --only-binary=pydantic-core \
            -r "$RUNNER_TEMP/python-prerelease-requirements.txt" \
            -r .github/python-prerelease-requirements.txt
          uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python"

      - name: Verify interpreter and installed native packages
        env:
          EXPECT_FREE_THREADED: ${{ endsWith(matrix.python-version, 't') && '1' || '0' }}
        run: |
          uv run python - <<'PY'
          import importlib.metadata
          import os
          import sys
          import sysconfig
          import biliass._core
          import pydantic_core
          import pytest_codspeed
          import yutto._core
          from yutto.cli.settings import YuttoSettings

          YuttoSettings.model_json_schema()
          print(sys.version)
          for name in ("yutto", "biliass", "pydantic", "pydantic-core", "typing-inspection", "pytest-codspeed"):
              print(name, importlib.metadata.version(name))
          assert sys.version_info[:2] == (3, 15)
          free_threaded = os.environ["EXPECT_FREE_THREADED"] == "1"
          assert bool(sysconfig.get_config_var("Py_GIL_DISABLED")) == free_threaded
          assert sys._is_gil_enabled() == (not free_threaded)
          PY

      - name: Run unit and corpus tests
        run: just ci-test ${{ matrix.python-version }}

      - name: Run remaining unit tests
        run: uv run pytest -m "not (api or processor or biliass or e2e or ci_skip or ignore)"

      - name: e2e without subprocess
        run: |
          uv run yutto -v
          uv run yutto -h
          uv run yutto https://www.bilibili.com/video/BV1AZ4y147Yg -w -d __test_files__
          rm -rf __test_files__

      - name: Run e2e tests
        run: just ci-e2e-test ${{ matrix.python-version }}

      - name: Check production metadata and lock are unchanged
        if: always()
        run: git diff --exit-code -- pyproject.toml packages/biliass/pyproject.toml uv.lock
