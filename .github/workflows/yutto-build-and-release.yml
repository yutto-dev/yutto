name: Build and Release (yutto)

on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    paths:
      - ".github/workflows/build-and-release.yml"
      - ".github/workflows/yutto-build-and-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.85 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - name: Check MSRV compatibility
        working-directory: rust
        run: |
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

  build-and-release:
    needs: msrv
    uses: ./.github/workflows/build-and-release.yml
    with:
      working-directory: .
      artifact-prefix: yutto
      release-ref-prefix: refs/tags/v
      # ring's aarch64 assembly does not compile with the manylinux2014 cross toolchain.
      manylinux-aarch64: "2_28"
    permissions:
      contents: write
      id-token: write
