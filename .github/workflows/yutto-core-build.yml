name: Build and Release (yutto-core)

on:
  push:
    tags:
      - "yutto-core@*"
    branches:
      - main
    paths:
      - "packages/yutto-core/**"
      - ".github/workflows/yutto-core-build.yml"
  pull_request:
    paths:
      - "packages/yutto-core/**"
      - "src/yutto/downloader/**"
      - ".github/workflows/yutto-core-build.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MATURIN_ACTION_VERSION: v1.14.1

jobs:
  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - name: Check locked workspace
        working-directory: packages/yutto-core/rust
        run: cargo check --locked --workspace --all-targets --all-features

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
            manylinux: "2_17"
          - target: aarch64
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          allow-prereleases: true
      - name: Build abi3 and free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_ACTION_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter '3.14 3.14t'
          sccache: "true"
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: packages/yutto-core
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: yutto-core-linux-${{ matrix.platform.target }}
          path: packages/yutto-core/dist

  musllinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          allow-prereleases: true
      - name: Build abi3 and free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_ACTION_VERSION }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter '3.14 3.14t'
          sccache: "true"
          manylinux: musllinux_1_2
          working-directory: packages/yutto-core
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: yutto-core-musllinux-${{ matrix.target }}
          path: packages/yutto-core/dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          allow-prereleases: true
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_ACTION_VERSION }}
          target: x64
          args: >-
            --release --out dist --interpreter
            ${{ steps.setup-python.outputs.python-path }}
          sccache: "true"
          working-directory: packages/yutto-core
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: yutto-core-windows-${{ matrix.python-version }}
          path: packages/yutto-core/dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          allow-prereleases: true
      - name: Build abi3 and free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_ACTION_VERSION }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter '3.14 3.14t'
          sccache: "true"
          working-directory: packages/yutto-core
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: yutto-core-macos-${{ matrix.target }}
          path: packages/yutto-core/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_ACTION_VERSION }}
          command: sdist
          args: --out dist
          working-directory: packages/yutto-core
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: yutto-core-sdist
          path: packages/yutto-core/dist

  publish-pypi:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/yutto-core@') }}
    needs: [msrv, linux, musllinux, windows, macos, sdist]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: yutto-core-*
          merge-multiple: true
          path: dist/
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Publish release distributions to PyPI
        run: uv publish -v

  publish-release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/yutto-core@') }}
    needs: [msrv, linux, musllinux, windows, macos, sdist]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: yutto-core-*
          merge-multiple: true
          path: dist/
      - name: Publish GitHub release draft
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
